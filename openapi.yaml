openapi: 3.1.0
info:
  title: mail-service
  description: Envío de correo por SMTP o por el proveedor de API configurado
  version: 0.1.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key con el formato ms_<clientId>_<secret>
  schemas:
    Address:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        name:
          type: string
          maxLength: 200
      required:
        - email
      additionalProperties: false
      description: Dirección de correo con nombre opcional
    Attachment:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          pattern: ^[\w.+-]+\/[\w.+-]+$
        contentBase64:
          type: string
          format: base64
          contentEncoding: base64
          pattern: ^$|^(?:[0-9a-zA-Z+/]{4})*(?:(?:[0-9a-zA-Z+/]{2}==)|(?:[0-9a-zA-Z+/]{3}=))?$
        contentId:
          description: "Para imágenes en línea referenciadas con cid:"
          type: string
          minLength: 1
          maxLength: 255
      required:
        - filename
        - contentType
        - contentBase64
      additionalProperties: false
      description: Adjunto codificado en base64
    SmtpServer:
      type: object
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          anyOf:
            - type: number
              const: 465
            - type: number
              const: 587
          description: "465: TLS implícito; 587: STARTTLS obligatorio. El 25 no se admite"
        auth:
          type: object
          properties:
            user:
              type: string
              minLength: 1
            pass:
              type: string
              minLength: 1
          required:
            - user
            - pass
          additionalProperties: false
        dkim:
          type: object
          properties:
            domainName:
              type: string
              minLength: 1
            keySelector:
              type: string
              minLength: 1
            privateKey:
              type: string
              minLength: 1
          required:
            - domainName
            - keySelector
            - privateKey
          additionalProperties: false
      required:
        - host
        - port
      additionalProperties: false
      description: Servidor SMTP del cliente; las credenciales se guardan cifradas
    SmtpTransport:
      type: object
      properties:
        type:
          type: string
          const: smtp
        smtp:
          $ref: "#/components/schemas/SmtpServer"
      required:
        - type
        - smtp
      additionalProperties: false
      description: Envío por el servidor SMTP indicado
    ApiTransport:
      type: object
      properties:
        type:
          type: string
          const: api
      required:
        - type
      additionalProperties: false
      description: Envío por el proveedor de API configurado en el servicio
    EmailRequest:
      type: object
      properties:
        transport:
          oneOf:
            - $ref: "#/components/schemas/SmtpTransport"
            - $ref: "#/components/schemas/ApiTransport"
        from:
          $ref: "#/components/schemas/Address"
        to:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/Address"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        replyTo:
          $ref: "#/components/schemas/Address"
        subject:
          type: string
          minLength: 1
        text:
          type: string
        html:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        headers:
          description: Cabeceras adicionales; no se admiten las que construye el servicio
          type: object
          propertyNames:
            type: string
            pattern: ^[A-Za-z0-9-]{1,100}$
          additionalProperties:
            type: string
            maxLength: 998
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
      required:
        - transport
        - from
        - to
        - subject
      additionalProperties: false
      description: Petición de envío de un correo
      examples:
        - transport:
            type: smtp
            smtp:
              host: smtp.example.com
              port: 587
              auth:
                user: notificaciones@example.com
                pass: ••••••
          from:
            email: notificaciones@example.com
            name: Example
          to:
            - email: cliente@dominio.com
          subject: Bienvenido
          html: <p>Hola</p>
          text: Hola
        - transport:
            type: api
          from:
            email: notificaciones@example.com
          to:
            - email: cliente@dominio.com
          subject: Bienvenido
          text: Hola
    MailgunEventData:
      type: object
      properties:
        event:
          type: string
          description: delivered, failed, complained, unsubscribed... El resto se ignora
        timestamp:
          type: number
          description: Hora del evento, en segundos desde epoch
        recipient:
          type: string
          description: Destinatario afectado
        severity:
          description: "Solo en failed: permanent es un rebote"
          type: string
          enum:
            - permanent
            - temporary
        message:
          type: object
          properties:
            headers:
              type: object
              properties:
                message-id:
                  description: Id del mensaje en Mailgun, sin <>
                  type: string
              additionalProperties: {}
          required:
            - headers
          additionalProperties: {}
        user-variables:
          type: object
          properties:
            messageId:
              description: Id interno del mensaje (v:messageId)
              type: string
          additionalProperties: {}
      required:
        - event
        - timestamp
        - recipient
      additionalProperties: {}
      description: Evento de Mailgun
    MailgunSignature:
      type: object
      properties:
        timestamp:
          type: string
          description: Segundos desde epoch
        token:
          type: string
          description: Cadena aleatoria de un solo uso
        signature:
          type: string
          description: HMAC-SHA256 en hex de timestamp + token
      required:
        - timestamp
        - token
        - signature
      description: Firma del webhook de Mailgun
    MailgunWebhookRequest:
      type: object
      properties:
        signature:
          $ref: "#/components/schemas/MailgunSignature"
        event-data:
          $ref: "#/components/schemas/MailgunEventData"
      required:
        - signature
        - event-data
      description: Webhook de eventos de Mailgun
    EmailStatus:
      type: string
      enum:
        - queued
        - sending
        - sent
        - failed
        - suppressed
      description: Estado del envío del mensaje
    RecipientStatus:
      type: string
      enum:
        - pending
        - suppressed
        - rejected
        - accepted
        - delivered
        - bounced
        - complained
        - unsubscribed
      description: Estado de entrega de un destinatario
    RecipientKind:
      type: string
      enum:
        - to
        - cc
        - bcc
      description: Campo en el que va el destinatario
    TransportType:
      type: string
      enum:
        - smtp
        - api
      description: Transporte de envío
    ProviderName:
      type: string
      enum:
        - smtp
        - mailgun
        - ses
      description: Servidor SMTP o proveedor de API que aceptó el envío
    AttemptOutcome:
      type: string
      enum:
        - success
        - transient_error
        - permanent_error
      description: Resultado de un intento de envío
    EmailAccepted:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: Identificador del mensaje (UUID v7)
        status:
          $ref: "#/components/schemas/EmailStatus"
        transport:
          $ref: "#/components/schemas/TransportType"
      required:
        - id
        - status
        - transport
      additionalProperties: false
      description: Mensaje aceptado para su envío
    EmailRecipientStatus:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        kind:
          $ref: "#/components/schemas/RecipientKind"
        status:
          $ref: "#/components/schemas/RecipientStatus"
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - email
        - kind
        - status
        - updatedAt
      additionalProperties: false
      description: Estado de entrega de un destinatario
    EmailAttempt:
      type: object
      properties:
        attempt:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: Número de intento, desde 1
        transport:
          $ref: "#/components/schemas/TransportType"
        provider:
          anyOf:
            - $ref: "#/components/schemas/ProviderName"
            - type: "null"
        outcome:
          $ref: "#/components/schemas/AttemptOutcome"
        code:
          description: Código del error del proveedor
          type:
            - string
            - "null"
        message:
          description: Mensaje del error del proveedor
          type:
            - string
            - "null"
        durationMs:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - attempt
        - transport
        - provider
        - outcome
        - code
        - message
        - durationMs
        - createdAt
      additionalProperties: false
      description: Intento de envío
    DeliverySummary:
      type: object
      properties:
        pending:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        suppressed:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        rejected:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        accepted:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        delivered:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        bounced:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        complained:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        unsubscribed:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
      additionalProperties: false
      description: Número de destinatarios por estado; solo aparecen los estados presentes
    EmailStatusResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        status:
          $ref: "#/components/schemas/EmailStatus"
        transport:
          $ref: "#/components/schemas/TransportType"
        provider:
          anyOf:
            - $ref: "#/components/schemas/ProviderName"
            - type: "null"
        providerMessageId:
          type:
            - string
            - "null"
        smtp:
          anyOf:
            - type: object
              properties:
                host:
                  type: string
                port:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
              required:
                - host
                - port
              additionalProperties: false
            - type: "null"
          description: Servidor SMTP, sin credenciales; null con transport api
        errorCode:
          type:
            - string
            - "null"
        errorMessage:
          type:
            - string
            - "null"
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/EmailRecipientStatus"
        deliverySummary:
          $ref: "#/components/schemas/DeliverySummary"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/EmailAttempt"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        sentAt:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
            - type: "null"
      required:
        - id
        - status
        - transport
        - provider
        - providerMessageId
        - smtp
        - errorCode
        - errorMessage
        - recipients
        - deliverySummary
        - attempts
        - createdAt
        - updatedAt
        - sentAt
      additionalProperties: false
      description: Estado de envío y de entrega de un mensaje
      examples:
        - id: 0192f0c4-5b1e-7c3a-9d2e-4f6a8b0c1d2e
          status: sent
          transport: api
          provider: mailgun
          providerMessageId: 20261029.abc@mg.example.com
          smtp: null
          errorCode: null
          errorMessage: null
          recipients:
            - email: a@dominio.com
              kind: to
              status: delivered
              updatedAt: 2026-10-29T10:00:05.000Z
            - email: b@dominio.com
              kind: cc
              status: bounced
              updatedAt: 2026-10-29T10:00:07.000Z
          deliverySummary:
            delivered: 1
            bounced: 1
          attempts:
            - attempt: 1
              transport: api
              provider: mailgun
              outcome: success
              code: null
              message: null
              durationMs: 240
              createdAt: 2026-10-29T10:00:01.000Z
          createdAt: 2026-10-29T10:00:00.000Z
          updatedAt: 2026-10-29T10:00:01.000Z
          sentAt: 2026-10-29T10:00:01.000Z
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - TRANSPORT_NOT_ALLOWED
        - FROM_DOMAIN_NOT_ALLOWED
        - NOT_FOUND
        - IDEMPOTENCY_CONFLICT
        - PAYLOAD_TOO_LARGE
        - SMTP_HOST_NOT_ALLOWED
        - API_TRANSPORT_NOT_CONFIGURED
        - RATE_LIMITED
        - INTERNAL_ERROR
      description: Código de error del servicio
    ValidationIssue:
      type: object
      properties:
        path:
          type: string
          description: Ruta JSON Pointer del campo, p. ej. /to/0/email
        message:
          type: string
        code:
          type: string
          description: Código de la validación que falló
      required:
        - path
        - message
        - code
      additionalProperties: false
      description: Error de validación de un campo
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            details:
              type: array
              items:
                $ref: "#/components/schemas/ValidationIssue"
              description: Solo con VALIDATION_ERROR
            requestId:
              type: string
              description: Igual que la cabecera X-Request-Id
          required:
            - code
            - message
            - details
            - requestId
          additionalProperties: false
      required:
        - error
      additionalProperties: false
      description: Formato común de todos los errores
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          const: ok
      required:
        - status
      additionalProperties: false
      description: El proceso responde
    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: object
          properties:
            postgres:
              type: string
              enum:
                - ok
                - error
            redis:
              type: string
              enum:
                - ok
                - error
            apiProvider:
              type: string
              enum:
                - ok
                - error
                - not_configured
              description: not_configured si MAIL_API_PROVIDER está vacío
          required:
            - postgres
            - redis
            - apiProvider
          additionalProperties: false
      required:
        - status
        - checks
      additionalProperties: false
      description: Estado de cada dependencia de la API
paths:
  /health:
    get:
      summary: El proceso responde
      tags:
        - health
      parameters:
        - schema:
            type: string
          in: header
          name: x-request-id
          required: false
          description: Identificador de la petición para correlacionar logs; se devuelve
            en la respuesta
      responses:
        "200":
          description: Proceso en marcha
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      summary: PostgreSQL, Redis y el proveedor de API responden
      tags:
        - health
      parameters:
        - schema:
            type: string
          in: header
          name: x-request-id
          required: false
          description: Identificador de la petición para correlacionar logs; se devuelve
            en la respuesta
      responses:
        "200":
          description: Todas las dependencias responden
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Alguna dependencia no responde
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /v1/emails:
    post:
      summary: Solicita el envío de un correo
      tags:
        - emails
      description: "Valida la petición, guarda el mensaje y lo encola. El envío es
        asíncrono: consulta su estado con GET /v1/emails/{id}."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          in: header
          name: idempotency-key
          required: false
          description: Repetir la petición con la misma clave no crea otro mensaje
        - schema:
            type: string
          in: header
          name: x-request-id
          required: false
          description: Identificador de la petición para correlacionar logs; se devuelve
            en la respuesta
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Mensaje ya existente con la misma Idempotency-Key y el mismo cuerpo
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAccepted"
        "202":
          description: Mensaje creado y encolado
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAccepted"
        "400":
          description: Petición inválida (VALIDATION_ERROR)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: API key ausente o inválida (UNAUTHORIZED)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Transporte o dominio de from no permitidos (TRANSPORT_NOT_ALLOWED,
            FROM_DOMAIN_NOT_ALLOWED)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Idempotency-Key ya usada con otro cuerpo (IDEMPOTENCY_CONFLICT)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Cuerpo demasiado grande (PAYLOAD_TOO_LARGE)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: La política o la configuración impiden el envío
            (SMTP_HOST_NOT_ALLOWED, API_TRANSPORT_NOT_CONFIGURED)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Límite de peticiones superado (RATE_LIMITED)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
            Retry-After:
              schema:
                type: integer
              description: Segundos que hay que esperar antes de reintentar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno (INTERNAL_ERROR)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/emails/{id}:
    get:
      summary: Consulta el estado de envío y de entrega de un mensaje
      tags:
        - emails
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: id
          required: true
          description: Identificador del mensaje
        - schema:
            type: string
          in: header
          name: x-request-id
          required: false
          description: Identificador de la petición para correlacionar logs; se devuelve
            en la respuesta
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estado del mensaje
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailStatusResponse"
        "400":
          description: Identificador con formato inválido (VALIDATION_ERROR)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: API key ausente o inválida (UNAUTHORIZED)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Mensaje inexistente o de otro cliente (NOT_FOUND)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Límite de peticiones superado (RATE_LIMITED)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
            Retry-After:
              schema:
                type: integer
              description: Segundos que hay que esperar antes de reintentar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno (INTERNAL_ERROR)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/webhooks/mailgun:
    post:
      summary: Recibe los eventos de entrega de Mailgun
      tags:
        - webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailgunWebhookRequest"
      responses:
        "204":
          description: Evento procesado, ignorado o repetido
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
        "400":
          description: Cuerpo inválido (VALIDATION_ERROR)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Firma inválida o timestamp fuera de la ventana de 5 minutos
            (UNAUTHORIZED)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Cuerpo demasiado grande (PAYLOAD_TOO_LARGE)
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno (INTERNAL_ERROR); el proveedor reintentará el evento
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Identificador de la petición (el recibido o uno generado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
tags:
  - name: emails
    description: Envío y estado de mensajes
  - name: health
    description: Estado del servicio
  - name: webhooks
    description: Eventos de entrega de los proveedores (expuestos a internet,
      autenticados por firma)
